<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create Account | CIRS</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
    <div class="logo">
        <span class="shield">🛡️</span>
        <span>Community Incident Reporting System</span>
    </div>
</header>

<main class="container">
    <h1>Create Your Account</h1>
    <p class="subtitle">Sign up to report incidents in your community.</p>

   <form id="registerForm">
    <label>Full Name</label>
    <input type="text" id="full_name" placeholder="Enter your full name" required />

    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email address" required />

    <label>Phone Number <span class="optional">(Optional)</span></label>
    <input type="tel" id="phone" placeholder="Enter your phone number" />

    <label>Password</label>
    <input type="password" id="password" placeholder="Create a password" required />

    <label>Confirm Password</label>
    <input type="password" id="confirm_password" placeholder="Confirm your password" required />
    
    <div class="checkbox">
        <label>
            <input type="checkbox" id="terms" required />
            I agree to the <a href="#">Terms & Privacy Policy</a>
        </label>
    </div>

    <button type="submit" class="primary-btn">Submit</button>
</form>


    <p class="note">
        Note: You can choose to submit reports anonymously if you prefer to keep your identity private.
    </p>
</main>

<script src="script.js"></script>
</body>
</html>
